app:
  host: 0.0.0.0
  port: 8025

ui:
  host: 0.0.0.0
  port: 5173

llm:
  api_key: sk-1234
  base_url: http://localhost:8009/v1
  default_model: qwen3-4b-fp8
  temperature: 1.0

embeddings:
  api_key: sk-1234
  base_url: http://localhost:8013/v1
  model: bge-m3

short_memory:
  enabled: true


legal_assistant:
  competition:
    enabled: false # true: bỏ qua Intent và chạy trực tiếp legal RAG cho tập test
  retrieval:
    query_mode: rewrite # none | rewrite | hyde
  query_rewrite:
    enabled: true
    use_llm: true
    max_variants: 3
  categories:
    top_k_when_le_2_categories: 2
    top_k_when_many_categories: 1
    hyde_top_k: 3
  postgres:
    enabled: true
    database_url: postgresql://postgres:postgres@localhost:23432/legal_assistant
    table_name: legal_knowledge_records
    category_column: category
    batch_size: 128
  vector_store:
    mode: hybrid # bm25 | chroma | hybrid
    persist_directory: ./chroma_db
    default_collection: legal_articles
    rrf_k: 60
    top_k: 8
    bm25_tokenizer: underthesea # auto | underthesea | regex
    bm25_k1: 2.0
    bm25_b: 1.0
    bm25_epsilon: 0.5
