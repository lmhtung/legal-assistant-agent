app:
  host: 0.0.0.0
  port: 8000

llm:
  api_key: sk-1234
  base_url: http://localhost:8001/v1
  default_model: qwen3-8b-fp8
  temperature: 0.0

embeddings:
  api_key: sk-1234
  base_url: http://localhost:8002/v1
  model: bge-m3

mcp_retrieval:
  enabled: false
  primary_server: legal_retrieval
  servers:
    legal_retrieval:
      url: http://localhost:8765/mcp
      transport: http
  fallback_to_local: true
  fetch_related: true
  related_top_k: 16

legal_assistant:
  retrieval:
    query_mode: rewrite_query # rewrite_query | hypothetical_answer
  query_rewrite:
    enabled: true
    use_llm: true
    max_variants: 3
  vector_store:
    mode: hybrid # bm25 | chroma | hybrid
    persist_directory: ./chroma_db
    default_collection: legal_articles
    rrf_k: 60
    top_k: 8
